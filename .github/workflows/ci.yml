name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Verificar lock
        run: uv lock --check

      - name: Instalar dependências
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check app tests

      - name: Type check (mypy, report-only)
        run: uv run mypy app/ --ignore-missing-imports || true

      - name: Testes (pytest)
        run: uv run pytest tests/ -q -p no:cacheprovider

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Lint (report-only)
        run: npm run lint || true

      - name: Build
        run: npm run build

  docker:
    name: Build imagens
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: emsoft-support-api:latest

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: emsoft-support-frontend:latest
