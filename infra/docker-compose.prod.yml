services:
  traefik:
    image: traefik:v3.1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-data:/etc/traefik/acme
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: production
      # Obrigatórios em produção (validate_production_secrets no boot)
      SECRET_KEY: ${SECRET_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      REDIS_URL: redis://redis:6379/0
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      # Appwrite: stack em infra/appwrite, alcançada pela rede compartilhada "appwrite" (09-1/09-4)
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-http://appwrite:80/v1}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY}
      QDRANT_URL: http://qdrant:6333
      # LLM: Ollama na própria pilha (09-15); OpenAI apenas se LLM_PROVIDER=openai
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # Emsoft chamados (spec 11): nasce desabilitado; contrato e bundle de CAs
      # já estão na imagem (/app/contracts, /app/certs). VERIFY_TLS não pode ser
      # false em produção (guard no boot); o bundle resolve a cadeia de CAs.
      EMSOFT_CHAMADOS_ENABLED: ${EMSOFT_CHAMADOS_ENABLED:-false}
      EMSOFT_CHAMADOS_TOKEN: ${EMSOFT_CHAMADOS_TOKEN:-}
      EMSOFT_CHAMADOS_CONTRACT_FILE: ${EMSOFT_CHAMADOS_CONTRACT_FILE:-/app/contracts/emsoft-chamados.json}
      EMSOFT_CHAMADOS_AI_USER_ID: ${EMSOFT_CHAMADOS_AI_USER_ID:-}
      EMSOFT_CHAMADOS_TIMEOUT_S: ${EMSOFT_CHAMADOS_TIMEOUT_S:-15}
      EMSOFT_CHAMADOS_VERIFY_TLS: ${EMSOFT_CHAMADOS_VERIFY_TLS:-true}
      EMSOFT_CHAMADOS_CA_BUNDLE: ${EMSOFT_CHAMADOS_CA_BUNDLE:-/app/certs/emsoft-ca-bundle.pem}
      # CORS: lista JSON exigida pelo pydantic-settings; default é o domínio do frontend
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://app.emsoft.app"]}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.emsoft.app`)"
    restart: unless-stopped
    networks:
      - default
      - appwrite
    # Sem dependência de postgres: o backend usa Appwrite; só a Evolution usa o Postgres
    depends_on:
      redis:
        condition: service_started
      ollama:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: https://api.emsoft.app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.emsoft.app`)"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emsoft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: emsoft
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emsoft"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # LLM local na pilha prod (09-15). Pull dos modelos:
  # docker compose -f infra/docker-compose.prod.yml exec ollama ollama pull <modelo>
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_PROTOCOL: https
      N8N_HOST: n8n.emsoft.app
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-emsoft-support}
      BACKEND_URL: http://backend:8000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.emsoft.app`)"
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    environment:
      SERVER_URL: https://evolution.emsoft.app
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://emsoft:${POSTGRES_PASSWORD}@postgres:5432/emsoft
      REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.evolution.rule=Host(`evolution.emsoft.app`)"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  ollama-data:
  n8n-data:
  traefik-data:

networks:
  # Rede do stack do Appwrite (infra/appwrite, nome fixo "appwrite"). Exige que
  # o stack Appwrite tenha sido subido ao menos uma vez no host; a rede persiste
  # no daemon mesmo com os containers parados.
  appwrite:
    external: true
    name: appwrite
