services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-n8n-dev-encryption-key}
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      WEBHOOK_URL: http://${N8N_HOST:-localhost}:${N8N_PORT:-5678}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:8080}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-emsoft-support}
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8001}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped
    depends_on:
      evolution-api:
        condition: service_started

  evolution-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    ports:
      - "${EVOLUTION_API_PORT:-8080}:8080"
    environment:
      SERVER_URL: http://localhost:${EVOLUTION_API_PORT:-8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-evolution_dev_key}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-db:5432/evolution
      REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
    depends_on:
      redis:
        condition: service_started
      evolution-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  qdrant-data:
  n8n-data:
  evolution-db-data:
